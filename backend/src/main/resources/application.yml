spring:
  application:
    name: viet-su-ky
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:viet_su_ky}?currentSchema=app
    username: ${DB_USERNAME:viet_su_ky}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: app
    schemas: app
    create-schemas: true
    baseline-on-migrate: false

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
